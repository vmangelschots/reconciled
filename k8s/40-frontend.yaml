# Static React build served by nginx. Built same-origin in CI, so it calls
# the API on whatever hostname the Ingress serves it from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reconciled
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciled-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reconciled-frontend
    spec:
      # Needed only if the GHCR packages are private - see k8s/README.md.
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/vmangelschots/reconciled-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reconciled
spec:
  selector:
    app.kubernetes.io/name: reconciled-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
