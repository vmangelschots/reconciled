# Non-secret settings of the public demo environment. Keep "localhost" in
# DJANGO_ALLOWED_HOSTS: the kubelet health probes send Host: localhost.
#
# There is deliberately no BANK_SYNC_TIMES: the demo environment has no
# bank-sync job, so the app should not advertise a next sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reconciled-config
  namespace: reconciled-test
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: reconciled-test.mangelschots.org,localhost
  CSRF_TRUSTED_ORIGINS: https://reconciled-test.mangelschots.org
  CORS_ALLOWED_ORIGINS: https://reconciled-test.mangelschots.org
  DB_HOST: postgres-svc
  DB_PORT: "5432"
  DB_NAME: reconciled
  # The demo has no OpenAI key; don't attempt calls when a visitor turns AI
  # categorization on in Settings.
  AI_CATEGORIZATION_ENABLED: "false"
