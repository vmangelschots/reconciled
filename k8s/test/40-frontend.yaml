# Static React build served by nginx. Built same-origin in CI, so it calls the
# API on whatever hostname the Ingress serves it from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciled-frontend
  namespace: reconciled-test
  labels:
    app.kubernetes.io/name: reconciled-frontend
    app.kubernetes.io/instance: reconciled-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciled-frontend
  template:
    metadata:
      labels:
        app: reconciled-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vmangelschots/reconciled-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reconciled-frontend-svc
  namespace: reconciled-test
  labels:
    app.kubernetes.io/name: reconciled-frontend
spec:
  type: ClusterIP
  selector:
    app: reconciled-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
