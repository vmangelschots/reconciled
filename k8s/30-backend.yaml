# Django API. Before gunicorn starts, an init container applies migrations
# and creates the app user from the Secret (bootstrap_user is idempotent
# and never resets an existing password).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: reconciled
spec:
  replicas: 1
  # Recreate, not RollingUpdate: never run an old and a new backend
  # against the same (possibly just-migrated) database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciled-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reconciled-backend
    spec:
      # Needed only if the GHCR packages are private - see k8s/README.md.
      # imagePullSecrets:
      #   - name: ghcr-pull
      initContainers:
        - name: migrate
          image: ghcr.io/vmangelschots/reconciled-backend:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_user"]
          envFrom:
            - configMapRef: { name: reconciled-config }
            - secretRef: { name: reconciled-secrets }
      containers:
        - name: backend
          image: ghcr.io/vmangelschots/reconciled-backend:latest
          imagePullPolicy: Always
          # Overrides the image's entrypoint.sh, which would migrate again.
          command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: reconciled-config }
            - secretRef: { name: reconciled-secrets }
          # Probes send Host: localhost - with the pod IP as Host, Django
          # would reject the request (it isn't in DJANGO_ALLOWED_HOSTS).
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: reconciled
spec:
  selector:
    app.kubernetes.io/name: reconciled-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
