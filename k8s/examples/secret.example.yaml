# Copy to k8s/15-secret.yaml (git-ignored), replace every change-me, then
# `kubectl apply -f k8s/`. This file lives in examples/ so that apply
# (which isn't recursive) never creates a Secret with placeholder values.
#
#   python -c "import secrets; print(secrets.token_urlsafe(50))"
#
# generates a good DJANGO_SECRET_KEY. OPENAI_API_KEY is optional: leave
# it out (or empty) to guess categories from your history only.
# HOUSEHOLD_ENCRYPTION_KEYS encrypts each household's Enable Banking key.
# Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Households enter their own Enable Banking details in Settings. The two
# commented ENABLE_BANKING values are only for upgrading: they move into the
# first household on the next start, and can then be removed.
apiVersion: v1
kind: Secret
metadata:
  name: reconciled-secrets
  namespace: reconciled
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me
  DB_USER: reconciled
  DB_PASSWORD: change-me
  BUDGET_APP_USERNAME: change-me
  BUDGET_APP_PASSWORD: change-me
  HOUSEHOLD_ENCRYPTION_KEYS: change-me
  # OPENAI_API_KEY: sk-change-me
  # ENABLE_BANKING_APP_ID: change-me
  # ENABLE_BANKING_PRIVATE_KEY: |
  #   change-me
