server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: let React Router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry page names the current build's assets, so the browser must
    # revalidate it - a reload after a deploy then gets the new app. Every
    # route ends up here through the fallback above. /assets/* are
    # fingerprinted and keep nginx's defaults.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
