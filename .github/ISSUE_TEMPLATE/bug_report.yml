name: Bug report
description: Something isn't working as expected
labels: ["bug"]
projects: ["vmangelschots/4"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version or commit, browser, and where it runs (local, docker, k8s).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant backend or browser console output.
      render: shell
