name: Feature request
description: Suggest an improvement or new feature
labels: ["enhancement"]
projects: ["vmangelschots/4"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
