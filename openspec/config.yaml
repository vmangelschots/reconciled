schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Project: "reconciled" - a personal budget app, drawing on ideas from
  YNAB/Actual Budget and PocketSmith/Firefly III.

  Stack: self-hosted web app. Django backend (Django REST Framework for the
  API, Django's ORM/migrations/auth/admin) - chosen deliberately for
  familiarity, don't propose swapping it for another Python framework.
  React frontend. Should be Docker-deployable for self-hosting, in the
  spirit of Firefly III.

  Budgeting model: traditional category budgeting, not zero-based envelope
  budgeting. Each category gets a monthly spending limit. On top of that,
  a PocketSmith-style cash-flow forecast projects future account balances
  forward from recurring transactions/bills and scheduled income.

  Transaction entry: CSV and OFX file import (upload a bank export, map
  columns, dedupe against existing transactions) and bank sync through
  Enable Banking (see openspec/specs/bank-sync). Other providers (e.g.
  Plaid/SimpleFIN) are not in scope unless the user asks.

  Assume single-user / single-household use unless the user says otherwise -
  no multi-tenant account system needed for v1.

